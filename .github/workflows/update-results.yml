name: Auto-Update Match Results

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run update script
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-results.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "WC2026 Bot"
          git config user.email "bot@wc26.rockyroo.fish"
          git add src/data/predictions.ts CHANGELOG.md package.json
          if git diff --staged --quiet; then
            echo "No changes — all results already up to date."
          else
            git commit -m "chore: auto-update match results [skip ci]"
            git push
          fi
