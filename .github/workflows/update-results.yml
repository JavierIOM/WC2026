name: Auto-Update Match Results

on:
  # Scheduled run removed 17 Sep 2026. The tournament finished on 19 July 2026,
  # so this had been firing every 3 hours, 8 times a day, for two months with no
  # matches left to find: roughly 480 pointless runs. It also holds an Anthropic
  # key, and an unattended job nobody watches is not worth keeping alive for a
  # feed that will never change again.
  #
  # To bring it back for the next tournament, restore:
  #   schedule:
  #     - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run update script
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-results.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "WC2026 Bot"
          git config user.email "bot@wc26.rockyroo.fish"
          git add src/data/predictions.ts CHANGELOG.md package.json
          if git diff --staged --quiet; then
            echo "No changes — all results already up to date."
          else
            git commit -m "chore: auto-update match results [skip ci]"
            git push
          fi
