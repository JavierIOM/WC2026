<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0d0d1a"/>

  <!-- Ball base (white circle) -->
  <circle cx="16" cy="16" r="11" fill="#f0f0f0"/>

  <!-- Classic football panel pattern (truncated icosahedron projection) -->
  <!-- Central pentagon (black) -->
  <polygon points="16,9.5 19.8,12.2 18.4,16.5 13.6,16.5 12.2,12.2" fill="#111"/>

  <!-- Surrounding black pentagons (partial, clipped by circle edge) -->
  <!-- Top right -->
  <polygon points="19.8,12.2 24.2,11 25.5,15.5 22,18.5 18.4,16.5" fill="#111"/>
  <!-- Bottom right -->
  <polygon points="22,18.5 23.5,22.5 19.5,25 16,23 18.4,16.5" fill="#111"/>
  <!-- Bottom left -->
  <polygon points="13.6,16.5 16,23 12.5,25 8.5,22.5 10,18.5" fill="#111"/>
  <!-- Top left -->
  <polygon points="12.2,12.2 13.6,16.5 10,18.5 6.5,15.5 7.8,11" fill="#111"/>
  <!-- Top -->
  <polygon points="16,9.5 12.2,12.2 7.8,11 9.5,7 16,6" fill="#111"/>

  <!-- Ball outline -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#ccc" stroke-width="0.5"/>
</svg>
